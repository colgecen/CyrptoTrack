name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore AvaloniaAppCrypto.csproj
      - name: Build
        run: dotnet build AvaloniaAppCrypto.csproj -c Release --no-restore
      - name: Test
        run: dotnet test Tests/AvaloniaAppCrypto.Tests.csproj -c Release
